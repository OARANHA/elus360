name: Build ELUS360 v1.94.0 (legacy smoke; no push)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: elus360-app
            dockerfile: Dockerfile
          - name: elus360-worker
            dockerfile: Dockerfile.worker
          - name: elus360-scheduler
            dockerfile: Dockerfile.scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          platforms: linux/amd64
          tags: ghcr.io/oaranha/${{ matrix.name }}:elus360-v1.94.0
          build-args: |
            APP_VERSION=1.94.0
          labels: |
            org.opencontainers.image.source=https://github.com/OARANHA/elus360
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=1.94.0
