name: ELUS360 — candidata sobre upstream limpo
on:
  pull_request:
    paths:
      - "scripts/elus360-clean-base-prepare.mjs"
      - "scripts/elus360-clean-base-classify.mjs"
      - "scripts/elus360-clean-base-adapters.mjs"
      - "tests/operational/elus360-clean-base.test.mjs"
      - "tests/operational/elus360-clean-base-classify.test.mjs"
      - "tests/operational/elus360-clean-base-adapters.test.mjs"
      - ".github/workflows/elus360-clean-base-candidate.yml"
      - "docs/elus360/clean-base-v1108.md"
      - "docs/elus360/clean-base-v1108-conflict-triage.md"
      - "docs/elus360/clean-base-v1108-composition.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-clean-base:
    name: Base oficial v1.108.0 + delta ELUS (sem publicação)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar Node e pnpm pelo gate canônico do repositório
        uses: ./.github/actions/preparar-node
        timeout-minutes: 5
      - name: Regressões locais do montador
        run: |
          set -euo pipefail
          node --check scripts/elus360-clean-base-prepare.mjs
          node --check scripts/elus360-clean-base-classify.mjs
          node --check scripts/elus360-clean-base-adapters.mjs
          node --test tests/operational/elus360-clean-base.test.mjs tests/operational/elus360-clean-base-classify.test.mjs tests/operational/elus360-clean-base-adapters.test.mjs
      - name: Comprovar tags oficiais e SHA da candidata
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::ELUS_CLEAN_BASE_NO_GO: $1"; exit 3; }
          base_tag='v1.102.0'
          target_tag='v1.108.0'
          base_expected='4b5815721710c9b1e99078322593838fda1ee740'
          target_expected='0b60c5abaace17922ae645399a6a6183a5f5c357'
          for tag in "$base_tag" "$target_tag"; do
            official="$(gh api "repos/melgarafael/DeskcommCRM/releases/tags/$tag" --jq '.draft == false and .prerelease == false and .published_at != null')" || fail "release $tag ausente"
            test "$official" = true || fail "release $tag sem publicação comprovada"
          done
          git fetch --no-tags https://github.com/melgarafael/DeskcommCRM.git \
            "refs/tags/$base_tag:refs/elus-clean/source" \
            "refs/tags/$target_tag:refs/elus-clean/target"
          base="$(git rev-parse 'refs/elus-clean/source^{commit}')"
          target="$(git rev-parse 'refs/elus-clean/target^{commit}')"
          test "$base" = "$base_expected" && test "$target" = "$target_expected" || fail 'SHA oficial divergente'
          git merge-base --is-ancestor "$base" "$target" || fail 'release não descende da base'
          [[ "$FORK_HEAD" =~ ^[a-f0-9]{40}$ ]] || fail 'fork HEAD não pinado'
          if ! git cat-file -e "$FORK_HEAD^{commit}"; then
            git fetch --no-tags origin "$FORK_HEAD"
          fi
          git cat-file -e "$FORK_HEAD^{commit}" || fail 'fork HEAD ausente'
          test -z "$(git status --porcelain)" || fail 'checkout modificado'
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "fork=$FORK_HEAD" >> "$GITHUB_OUTPUT"
      - name: Compor worktree oficial limpo e exportar diferenças reaplicáveis
        env:
          BASE: ${{ steps.source.outputs.base }}
          TARGET: ${{ steps.source.outputs.target }}
          FORK: ${{ steps.source.outputs.fork }}
        run: |
          set -euo pipefail
          node scripts/elus360-clean-base-prepare.mjs \
            --base "$BASE" --target "$TARGET" --fork "$FORK" \
            --out "$RUNNER_TEMP/elus360-official-clean" \
            --reports "$RUNNER_TEMP/elus360-clean-reports"
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          const report = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'elus360-clean-reports/elus360-clean-base-report.json'), 'utf8'));
          const c = report.counts;
          const summary = [
            '## ELUS360 — reconstrução sobre DeskcommCRM v1.108.0',
            `Base oficial: ${report.upstream_target_sha}`,
            `Fork de origem: ${report.fork_sha}`,
            `Delta próprio: ${c.fork_delta} caminhos`,
            `Aplicados em worktree descartável: ${c.staged}`,
            `Colisões a resolver: ${c.conflicts}`,
            `Já idênticos ao upstream: ${c.already_in_upstream}`,
            `Caminhos reaplicados que exigem validação específica: ${c.staged_requiring_validation}`,
            '',
            '**CANDIDATA DE CÓDIGO NÃO HOMOLOGADA.** Nenhum merge, migration ou deploy executado.'
          ].join('\n');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          if (c.conflicts) console.log(`::warning::ELUS_OVERLAY_INCOMPLETE: ${c.conflicts} colisões precisam de integração explícita`);
          NODE
      - name: Classificar todos os conflitos sem aprovar caminhos
        run: |
          set -euo pipefail
          node scripts/elus360-clean-base-classify.mjs \
            "$RUNNER_TEMP/elus360-clean-reports/elus360-clean-base-report.json" \
            "$RUNNER_TEMP/elus360-clean-reports/elus360-clean-base-classification.json" \
            "$RUNNER_TEMP/elus360-clean-reports/elus360-clean-base-classification.md"
          cat "$RUNNER_TEMP/elus360-clean-reports/elus360-clean-base-classification.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Aplicar adaptadores ELUS somente sobre blobs oficiais pinados
        id: compose_adapters
        run: |
          set -euo pipefail
          node scripts/elus360-clean-base-adapters.mjs \
            --candidate "$RUNNER_TEMP/elus360-official-clean" \
            --source-report "$RUNNER_TEMP/elus360-clean-reports/elus360-clean-base-report.json" \
            --reports "$RUNNER_TEMP/elus360-clean-reports"

      - name: Instalar dependências do código oficial composto (runner efêmero)
        id: composed_install
        continue-on-error: true
        if: ${{ steps.compose_adapters.outcome == 'success' }}
        run: pnpm --dir "$RUNNER_TEMP/elus360-official-clean" install --frozen-lockfile

      - name: TypeScript de TODA a árvore composta v1.108.0
        id: composed_types
        continue-on-error: true
        if: ${{ steps.composed_install.outcome == 'success' }}
        env:
          # OOM real no job 131030826900 com heap padrão de ~2 GiB; limite explícito
          # abaixo da RAM do runner ubuntu-24.04, sem afrouxar timeouts ou ignorar TS.
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: pnpm --dir "$RUNNER_TEMP/elus360-official-clean" typecheck

      - name: Regressões de IA, tenant e governança na árvore composta
        id: composed_units
        continue-on-error: true
        if: ${{ steps.composed_install.outcome == 'success' }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/elus360-official-clean"
          pnpm exec vitest run \
            tests/unit/elus360-chutes-plataforma.test.ts \
            tests/unit/elus360-version-governance.test.ts \
            tests/unit/elus360-ia-gerenciada-guard.test.ts \
            lib/elus360/ai-managed/authorize-version-write.test.ts \
            'app/api/v1/ai/agents/[id]/versions/[vid]/patch.route.test.ts'

      - name: Build de produção do código composto (SEM publicar imagem)
        id: composed_build
        continue-on-error: true
        if: ${{ steps.composed_install.outcome == 'success' }}
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: pnpm --dir "$RUNNER_TEMP/elus360-official-clean" build

      - name: Publicar vereditos da árvore composta e reprovar falhas reais
        if: always()
        env:
          ADAPTERS: ${{ steps.compose_adapters.outcome }}
          INSTALL: ${{ steps.composed_install.outcome }}
          TYPES: ${{ steps.composed_types.outcome }}
          UNIT: ${{ steps.composed_units.outcome }}
          BUILD: ${{ steps.composed_build.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const folder=path.join(process.env.RUNNER_TEMP,'elus360-clean-reports');
          const statuses=Object.fromEntries(['ADAPTERS','INSTALL','TYPES','UNIT','BUILD'].map(k=>[k.toLowerCase(),process.env[k]]));
          const failed=Object.entries(statuses).filter(([,v])=>v!=='success').map(([k])=>k);
          const file=path.join(folder,'elus360-composed-report.json');
          const composition=fs.existsSync(file)?JSON.parse(fs.readFileSync(file,'utf8')):null;
          const remaining=composition?.counts?.unresolved??null;
          const record={schema_version:1,stage:failed.length?'COMPOSED_TEST_FAILED':'COMPOSED_TECHNICAL_CHECKS_PASSED',
            source_sha:composition?.fork_sha??null,upstream_target_sha:composition?.upstream_target_sha??null,
            statuses,failed_steps:failed,unresolved_conflicts:remaining,
            release_gate:'NO_GO_PENDING_ADAPTERS_DB_AUTH_E2E'};
          fs.mkdirSync(folder,{recursive:true});
          fs.writeFileSync(path.join(folder,'elus360-composed-validation.json'),JSON.stringify(record,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '\n## Validação da aplicação composta\n\n'+
            Object.entries(statuses).map(([k,v])=>'- '+k+': '+v).join('\n')+
            '\nConflitos não resolvidos: '+String(remaining)+
            '\n**Release NO-GO:** autorização, DB upgrade e E2E real da versão composta pendentes.\n');
          if(failed.length){console.error('ELUS_COMPOSED_VALIDATION_NO_GO: '+failed.join(', '));process.exitCode=1;}
          else if(remaining)console.log('::warning::ELUS_RELEASE_NO_GO: '+remaining+' conflitos ainda exigem revisão');
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elus360-clean-base-v1108
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/elus360-clean-reports/elus360-clean-base-report.json
            ${{ runner.temp }}/elus360-clean-reports/elus360-clean-base.patch
            ${{ runner.temp }}/elus360-clean-reports/elus360-clean-base-classification.json
            ${{ runner.temp }}/elus360-clean-reports/elus360-clean-base-classification.md
            ${{ runner.temp }}/elus360-clean-reports/elus360-composed-report.json
            ${{ runner.temp }}/elus360-clean-reports/elus360-composed.patch
            ${{ runner.temp }}/elus360-clean-reports/elus360-composed-validation.json
