# ELUS360 AMD64-only distribution: CI-only smoke for four owned images.
# ARM64 permanently excluded by owner decision. Publication remains DISABLED.
# GO: review PR build; NO-GO: GHCR push, release, stable, deploy.
name: ELUS360 distribution - four images smoke (no publish)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-elus360.yml"
      - "Dockerfile*"
      - "docker-compose.prod.yml"
      - "hostgator-setup-kit/**"
      - "scripts/elus360-distribution-guard.py"
      - "tests/distribution/**"
      - "tests/shell/update-guard.test.sh"
      - "tests/shell/install-portao-do-build.test.sh"
      - "tests/shell/guarda-arm-nao-mata-a-recuperacao.test.sh"
      - "tests/shell/arquitetura-kit.test.sh"
      - "docs/adr/0007-elus360-linux-amd64.md"
      - ".env.hostgator.example"

permissions:
  contents: read

concurrency:
  group: elus360-distribution-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-distribution:
    if: github.repository == 'OARANHA/elus360' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test provenance, fail-closed updater and rollback plans
        run: python3 -m unittest discover -s tests/distribution -p 'test_*.py' -v
      - name: Validate shell files (does not execute installer/updater)
        run: |
          bash -n hostgator-setup-kit/_common.sh
          bash -n hostgator-setup-kit/_manifestos.sh
          bash -n hostgator-setup-kit/install.sh
          bash -n hostgator-setup-kit/update.sh
          bash -n hostgator-setup-kit/agent.sh
      - name: Legacy distribution regressions (isolated mocks, no real Docker)
        run: |
          bash tests/shell/install-portao-do-build.test.sh
          bash tests/shell/guarda-arm-nao-mata-a-recuperacao.test.sh
          bash tests/shell/update-guard.test.sh
          bash tests/shell/arquitetura-kit.test.sh

  smoke-images:
    needs: [verify-distribution]
    if: github.repository == 'OARANHA/elus360' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - {name: elus360, file: Dockerfile}
          - {name: elus360-worker, file: Dockerfile.worker}
          - {name: elus360-scheduler, file: Dockerfile.scheduler}
          - {name: elus360-voice-agent, file: Dockerfile.voice-agent}
        arch: [amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build only, NEVER push (no credentials or GHCR token)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: linux/amd64
          push: false
          build-args: |
            APP_VERSION=distribution-smoke
          labels: |
            org.opencontainers.image.source=https://github.com/OARANHA/elus360
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=distribution-smoke
