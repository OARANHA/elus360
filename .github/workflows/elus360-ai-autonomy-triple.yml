name: ELUS 360 - AI Autonomy Migration Triple

on:
  pull_request:
    paths:
      - "supabase/baseline.sql"
      - "supabase/migrations/*_elus_ai_autonomy_guarded.sql"
      - "tests/operational/elus360-ai-autonomy-triple.test.mjs"
      - "tests/operational/elus360-ai-autonomy-postgres.sql"
      - "tests/operational/elus360-ai-write-boundary.test.mjs"
      - "tests/operational/elus360-ai-autonomy-concurrency.sh"
      - ".github/workflows/elus360-ai-autonomy-triple.yml"
      - "lib/elus360/ai-managed/**"
      - "app/api/v1/ai/**"
      - "app/app/ai/agents/[id]/_actions.ts"
      - "app/api/v1/admin/tenants/**/ai-permissions/**"
      - "tests/unit/elus360-*.test.ts"
      - "tests/unit/versao-do-agente-referencias-da-org.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sintaxe do verificador
        run: node --check tests/operational/elus360-ai-autonomy-triple.test.mjs
      - name: Paridade e restricoes do schema
        run: node --test tests/operational/elus360-ai-autonomy-triple.test.mjs
      - name: Integrações críticas antes das escritas
        run: node --test tests/operational/elus360-ai-write-boundary.test.mjs

  governance-unit-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Dependências verificadas pelo lockfile
        run: pnpm install --frozen-lockfile
      - name: TypeScript global
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: pnpm typecheck
      - name: Governança IA — testes unitários e de handlers
        run: >-
          pnpm exec vitest run
          lib/elus360/ai-managed/authorize-version-write.test.ts
          lib/elus360/ai-managed/server.test.ts
          tests/unit/elus360-ia-gerenciada-guard.test.ts
          tests/unit/elus360-version-governance.test.ts
          app/api/v1/admin/tenants/[id]/ai-permissions/route.test.ts
          tests/unit/versao-do-agente-referencias-da-org.test.ts
      - name: Integridade e colisão de migrations
        run: pnpm checar:colisao-de-migration

  autonomy-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_disposable_only
          POSTGRES_DB: elus_ai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elus_ai_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Migration, idempotência e papéis em banco descartável
        env:
          PGPASSWORD: ci_disposable_only
        run: >-
          psql -h 127.0.0.1 -p 5432 -U postgres
          -d elus_ai_ci -v ON_ERROR_STOP=1
          -f tests/operational/elus360-ai-autonomy-postgres.sql
      - name: Duas conexões — serialização por lock de organização
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci_disposable_only
          PGDATABASE: elus_ai_ci
        run: bash tests/operational/elus360-ai-autonomy-concurrency.sh
