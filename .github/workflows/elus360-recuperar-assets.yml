name: Recuperar assets ELUS
on:
  push:
    branches:
      - feat/elus360-login-publica-upstream-safe-20261028
    paths:
      - .github/workflows/elus360-recuperar-assets.yml

permissions:
  contents: write

jobs:
  copiar-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/elus360-login-publica-upstream-safe-20261028
      - name: Copiar as imagens originais do ELUS anterior
        run: |
          set -euo pipefail
          mkdir -p public/brand/elus
          for file in login-hero.png logo-horizontal.png logo-symbol.png mascote-nexus.webp; do
            curl --fail --location --retry 3 --silent --show-error \
              "https://raw.githubusercontent.com/OARANHA/elus/main/public/brand/elus/$file" \
              --output "public/brand/elus/$file"
            test -s "public/brand/elus/$file"
          done
          file public/brand/elus/*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/brand/elus
          git diff --cached --quiet && exit 0
          git commit -m 'assets(elus360): recuperar imagens originais da marca'
          git push origin HEAD:feat/elus360-login-publica-upstream-safe-20261028
