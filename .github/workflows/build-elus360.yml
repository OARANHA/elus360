name: Build ELUS 360 v1.94.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-elus360.yml'
      - 'Dockerfile'
      - 'Dockerfile.worker'
      - 'Dockerfile.scheduler'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: elus360-app
            dockerfile: Dockerfile
          - name: elus360-worker
            dockerfile: Dockerfile.worker
          - name: elus360-scheduler
            dockerfile: Dockerfile.scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/oaranha/${{ matrix.name }}:elus360-v1.94.0
          build-args: |
            APP_VERSION=1.94.0
          labels: |
            org.opencontainers.image.source=https://github.com/OARANHA/elus360
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=1.94.0
